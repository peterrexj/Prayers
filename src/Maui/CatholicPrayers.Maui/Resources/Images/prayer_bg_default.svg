<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- Radiant glow behind cross -->
  <radialGradient id="glow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="600" fill="url(#glow)"/>
  <!-- Cross -->
  <rect x="188" y="160" width="24" height="160" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="130" y="210" width="140" height="24" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <!-- Subtle rays -->
  <line x1="200" y1="240" x2="120" y2="140" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <line x1="200" y1="240" x2="280" y2="140" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <line x1="200" y1="240" x2="80"  y2="300" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <line x1="200" y1="240" x2="320" y2="300" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
</svg>
